name: Publish

# Tag scheme: `eslint-plugin-skill@X.Y.Z` publishes that package. Only the
# eslint-plugin is published today; @weareikko/motto is private until Phase B.
on:
  push:
    tags:
      - 'eslint-plugin-skill@*.*.*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build (all workspaces)
        run: npm run build

      - name: Determine npm tag and prerelease flag
        run: |
          VERSION=${GITHUB_REF_NAME#eslint-plugin-skill@}
          NPM_TAG='latest'
          IS_PRERELEASE=false

          if [[ $VERSION =~ (alpha|beta|rc) ]]; then
            NPM_TAG='next'
            IS_PRERELEASE=true
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "NPM_TAG=$NPM_TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV

      # No `--provenance`: this repository is private, and npm provenance
      # requires a public source repository. Add it back (plus a
      # `id-token: write` permission) if the repo is ever made public.
      - name: Publish @weareikko/eslint-plugin-skill
        run: npm publish -w @weareikko/eslint-plugin-skill --access public --tag ${{ env.NPM_TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Please refer to [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/packages/eslint-plugin-skill/CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
